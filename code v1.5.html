<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saevin | Creative OS</title>
    <style>
        :root {
            --bg-color: #0e0f11;
            --sidebar-bg: #151618;
            --panel-bg: #1c1d21;
            --text-main: #ededed;
            --text-muted: #8a8f98;
            --accent: #5e6ad2;
            --border: #2c2d30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 32px;
            padding-left: 8px;
        }

        .nav-group {
            margin-bottom: 24px;
        }

        .nav-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 8px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-item {
            padding: 6px 8px;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: background 0.1s;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .add-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .add-btn:hover {
            color: var(--text-main);
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 48px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Task Board */
        .task-input-container {
            margin-bottom: 24px;
        }

        .task-input {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .task-input:focus {
            border-color: var(--accent);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .task:hover {
            border-color: #3f4044;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .checkbox {
            width: 16px;
            height: 16px;
            border: 1px solid var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
        }

        .checkbox:hover {
            border-color: var(--text-main);
        }

        .task-tag {
            font-size: 11px;
            background-color: rgba(94, 106, 210, 0.2);
            color: #8c96f8;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Right Panel (Focus Timer) */
        .right-panel {
            width: 300px;
            border-left: 1px solid var(--border);
            padding: 24px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
        }

        .timer-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }

        .timer-display {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 16px;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn.secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            margin-top: 8px;
        }

        .btn.secondary:hover {
            background-color: rgba(255,255,255,0.05);
        }

        .activity-log {
            flex: 1;
            overflow-y: auto;
        }

        .log-item {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">&nbsp;</div>
        
        <div class="nav-group">
            <div class="nav-item active" onclick="switchView('Today', this)"><span>☀️ Today</span></div>
            <div class="nav-item" onclick="switchView('Inbox', this)"><span>📥 Inbox</span></div>
            <div class="nav-item" onclick="switchView('Ideas & Notes', this)"><span>💡 Ideas & Notes</span></div>
        </div>

        
</div>
    </aside>

    <!-- Main Workspace -->
    <main class="main">
        <div class="header">
            <h1 id="viewTitle">Good evening.</h1>
            <p id="viewSubtitle">Welcome to your new workspace. Add your tasks for today.</p>
        </div>

        <div class="task-input-container">
            <input type="text" id="newTaskInput" class="task-input" placeholder="Type a task and press Enter...">
        </div>

        <div class="task-list" id="taskList">
            <!-- Rendered via JS state -->
        </div>
    </main>

    <!-- Right Panel: Focus & Activity -->
    <aside class="right-panel">
        <div class="nav-title" style="margin-bottom: 16px;"><span>Current Focus</span></div>
        
        <div class="timer-card">
            <div class="timer-display" id="timer">25:00</div>
            <button class="btn" id="startBtn" onclick="toggleTimer()">Start Deep Work</button>
            <button class="btn secondary" onclick="resetTimer()">Reset</button>
        </div>

        <div class="nav-title" style="margin-top: 16px; margin-bottom: 16px;"><span>Today's Activity</span></div>
        <div class="activity-log" id="activityLog">
            <div class="log-item">
                <span>Created workspace</span>
                <span>Just now</span>
            </div>
        </div>
    </aside>

    <!-- App Logic (LocalStorage + Full Customization) -->
    <script>
        // State Management
        let currentView = 'Today';
        let projects = loadFromStorage('saevin_projects', ['🎬 GOS Video', '🎵 Album EP', '📚 Year 11 School']);
        let tasks = loadFromStorage('saevin_tasks', [
            { id: 1, text: 'Set up custom projects in sidebar', tag: 'System', done: false, view: 'Today' },
            { id: 2, text: 'Draft script for GOS Video', tag: '🎬 GOS Video', done: false, view: 'Today' },
            { id: 3, text: 'Test the focus timer on the right', tag: 'Focus', done: false, view: 'Today' }
        ]);
        let activityLogs = loadFromStorage('saevin_logs', [{ text: 'Created workspace', time: 'Just now' }]);

        function loadFromStorage(key, fallback) {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : fallback;
        }

        function saveToStorage() {
            localStorage.setItem('saevin_projects', JSON.stringify(projects));
            localStorage.setItem('saevin_tasks', JSON.stringify(tasks));
            localStorage.setItem('saevin_logs', JSON.stringify(activityLogs));
        }

        // Render Sidebar Projects
        function renderProjects() {
            const list = document.getElementById('projectNavList');
            list.innerHTML = projects.map(p => `
                <div class="nav-item ${currentView === p ? 'active' : ''}" onclick="switchView('${p.replace(/'/g, "\\'")}', this)">
                    <span>${p}</span>
                    <button class="add-btn" style="font-size:11px;" onclick="event.stopPropagation(); deleteProject('${p.replace(/'/g, "\\'")}')">×</button>
                </div>
            `).join('');
        }

        function addProject() {
            const name = prompt('Enter new project name (e.g. 📸 Photography):');
            if (name && name.trim()) {
                projects.push(name.trim());
                saveToStorage();
                renderProjects();
                logActivity(`Added project: ${name.trim()}`);
            }
        }

        function deleteProject(name) {
            if (confirm(`Delete project "${name}"?`)) {
                projects = projects.filter(p => p !== name);
                if (currentView === name) switchView('Today');
                saveToStorage();
                renderProjects();
                logActivity(`Deleted project: ${name}`);
            }
        }

        // Navigation & View Switcher
        function switchView(viewName, el) {
            currentView = viewName;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (el) {
                el.classList.add('active');
            } else {
                // Find matching element if switched programmatically
                document.querySelectorAll('.nav-item').forEach(item => {
                    if (item.textContent.trim().startsWith(viewName)) item.classList.add('active');
                });
            }

            document.getElementById('viewTitle').textContent = viewName;
            document.getElementById('viewSubtitle').textContent = viewName === 'Today' || viewName === 'Inbox' || viewName === 'Ideas & Notes' 
                ? `Managing items in ${viewName.toLowerCase()}.` 
                : `Workspace for project: ${viewName}`;
            
            renderTasks();
            renderProjects();
        }

        // Task Rendering & Management
        const taskInput = document.getElementById('newTaskInput');
        const taskList = document.getElementById('taskList');

        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && taskInput.value.trim() !== '') {
                addTask(taskInput.value.trim());
                taskInput.value = '';
            }
        });

        function addTask(text) {
            const tag = projects.includes(currentView) ? currentView : (currentView === 'Ideas & Notes' ? 'Idea' : 'Inbox');
            const newTask = {
                id: Date.now(),
                text: text,
                tag: tag,
                done: false,
                view: currentView
            };
            tasks.unshift(newTask);
            saveToStorage();
            renderTasks();
            logActivity(`Added task to ${currentView}`);
        }

        function renderTasks() {
            const visibleTasks = tasks.filter(t => t.view === currentView);
            taskList.innerHTML = visibleTasks.map(t => `
                <div class="task" style="${t.done ? 'opacity: 0.5; text-decoration: line-through;' : ''}">
                    <div class="task-left">
                        <div class="checkbox" style="${t.done ? 'background-color: #ededed;' : ''}" onclick="toggleTask(${t.id})"></div>
                        <span>${t.text}</span>
                    </div>
                    <span class="task-tag">${t.tag}</span>
                </div>
            `).join('');
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                saveToStorage();
                renderTasks();
                if (task.done) logActivity(`Completed task: "${task.text}"`);
            }
        }

        // Focus Timer Logic
        let timeRemaining = 25 * 60;
        let timerInterval = null;
        let isRunning = false;
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.textContent = "Resume Focus";
                startBtn.style.backgroundColor = "#ededed";
                startBtn.style.color = "#0e0f11";
                isRunning = false;
            } else {
                logActivity("Started 25m focus session");
                startBtn.textContent = "Pause";
                startBtn.style.backgroundColor = "#3f4044";
                startBtn.style.color = "#ededed";
                isRunning = true;
                timerInterval = setInterval(() => {
                    if (timeRemaining > 0) {
                        timeProvenanceTick();
                    } else {
                        clearInterval(timerInterval);
                        logActivity("Completed focus session! 🎉");
                        alert("Focus session complete!");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function timerProvenanceTick() {
            timeRemaining--;
            updateTimerDisplay();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeRemaining = 25 * 60;
            isRunning = false;
            updateTimerDisplay();
            startBtn.textContent = "Start Deep Work";
            startBtn.style.backgroundColor = "#ededed";
            startBtn.style.color = "#0e0f11";
        }

        // Activity Logger
        const activityLogEl = document.getElementById('activityLog');

        function logActivity(actionText) {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            activityLogs.unshift({ text: actionText, time: timeString });
            if (activityLogs.length > 50) activityLogs.pop();
            saveToStorage();
            renderActivityLogs();
        }

        function renderActivityLogs() {
            activityLogEl.innerHTML = activityLogs.map(l => `
                <div class="log-item">
                    <span>${l.text}</span>
                    <span>${l.time}</span>
                </div>
            `).join('');
        }

        // Initial render load
        renderProjects();
        renderTasks();
        renderActivityLogs();
    </script>
</body>
</html>
